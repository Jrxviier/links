<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jr. Xavier-Dev.</title>

    <!-- Estilos externos -->
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="#" />
  </head>

  <body>
    <!-- Container principal -->
    <div class="container">
      <div class="content">
        <!-- WIDGET 1: Informações do usuário -->
        <div class="widget1">
          <div class="info-user">
            <div class="img-user">
              <img src="image/user.jpg" alt="Imagem do usuário" />
            </div>
            <div class="name-user">
              <h1>Júnior Xavier</h1>
              <span>@juniorxviier</span>
            </div>
          </div>
          <div class="info-icon">
            <img src="image/complemento.png" alt="Ícone complementar" />
          </div>
        </div>

        <!-- WIDGET 2: Informações CTA -->
        <div class="widget2">
          <div class="cta-info">
            <span
              >Criando jornadas<span class="destaque"> online.</span><br />
              intuitivas e memoráveis.</span
            >
          </div>
        </div>

        <!-- WIDGET 3: Redes sociais e link do site -->
        <div class="widget3">
          <!-- Link do site -->
          <a
            href="https://jrxviier.github.io/Portifolio/index.html"
            target="_blank"
            class="site"
          >
            <div class="text-site">
              <h1>Portifólio</h1>
              <span>Conheça um pouco do meu Trabalho.</span>
            </div>
            <div class="img-site"></div>
          </a>

          <!-- Redes sociais -->
          <div class="redes-sociais">
            <!-- YouTube -->
            <a
              class="box-social youtube"
              href="https://www.youtube.com"
              target="_blank"
            >
              <i class="fab fa-youtube"></i>
            </a>

            <!-- Instagram -->
            <a
              class="box-social instagram"
              href="https://github.com/Jrxviier"
              target="_blank"
            >
              <i class="fab fa-github"></i>
            </a>

            <!-- Spotify -->
            <a
              class="box-social spotify"
              href="https://spotify.com"
              target="_blank"
            >
              <i class="fab fa-deezer"></i>
            </a>

            <!-- Email -->
            <a
              class="box-social mail"
              href="mailto:jrxvierdevfront@outlook.com"
              target="_blank"
            >
              <i class="fas fa-envelope"></i>
            </a>
          </div>
        </div>

        <!-- WIDGET 4: Call to action adicional -->
        <div class="widget4">
          <a href="#" class="cta" target="_blank">
            <i class="fas fa-calendar-alt"></i>
            <h1>
              O sucesso não é sobre quanto dinheiro você ganha, mas sobre a
              diferença que você faz.
            </h1>
          </a>
        </div>

        <!-- WIDGET 5: Embeds do Deezer -->
        <div class="widget5">
          <span>Musica boa!? Sim Gostamos...</span>

          <!-- EMBED 1: Playlist do Deezer -->
          <iframe
            title="deezer-widget"
            src="https://widget.deezer.com/widget/dark/playlist/5274597666"
            width="100%"
            height="250"
            frameborder="0"
            allowtransparency="true"
            allow="encrypted-media; clipboard-write"
          ></iframe>
          <!-- Para alterar, substitua o link no atributo src pelo embed da playlist ou música desejada no Spotify -->

          <!-- EMBED 2: Playlist do Deezer -->
          <iframe
            title="deezer-widget"
            src="https://widget.deezer.com/widget/dark/playlist/3677164886"
            width="100%"
            height="300"
            frameborder="0"
            allowtransparency="true"
            allow="encrypted-media; clipboard-write"
          ></iframe>
        </div>
      </div>
    </div>
  </body>
</html>
